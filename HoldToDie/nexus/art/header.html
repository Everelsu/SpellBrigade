<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  .scene { background-position: 50% 12%; }
  .shade { background: linear-gradient(90deg, rgba(6, 9, 20, .9) 0%, rgba(6, 9, 20, .7) 50%, rgba(40, 8, 12, .55) 100%); }
  .content { position: absolute; inset: 0; padding: 0 110px 0 80px; display: flex; align-items: center; justify-content: space-between; }
  .title { font-size: 84px; padding-bottom: 20px; }
  .hold { width: 250px; height: 250px; }
  .hold .track, .hold .fill { stroke-width: 18; }
  .key { width: 106px; height: 106px; border-width: 8px; font-size: 70px; }
</style></head>
<body><div class="canvas">
  <div class="scene"></div><div class="shade"></div>
  <div class="content">
    <div class="title">Hold to Die</div>
    <div class="hold">
      <!-- r=116, длина окружности ≈ 729; заполнено на 72% -->
      <svg viewBox="0 0 250 250"><circle class="track" cx="125" cy="125" r="116"/>
        <circle class="fill" cx="125" cy="125" r="116" stroke-dasharray="525 729"/></svg>
      <div class="key">K</div>
    </div>
  </div>
</div></body></html>
