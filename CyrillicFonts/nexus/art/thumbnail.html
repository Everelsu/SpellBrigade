<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  .scene { background-position: 50% 10%; }
  .shade { background: radial-gradient(circle at 50% 45%, rgba(6, 9, 20, .55) 0%, rgba(6, 9, 20, .85) 75%); }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-bottom: 20px; }
  .latin { font-size: 58px; opacity: .55; letter-spacing: .02em; }
  .arrow { font-family: "Segoe UI"; font-size: 46px; color: var(--gold); line-height: 1; margin: -6px 0 -4px; }
  .cyr { font-size: 132px; }
  .words { font-size: 60px; }
  .title { font-size: 56px; margin-top: 26px; }
</style></head>
<body><div class="canvas">
  <div class="scene"></div><div class="shade"></div>
  <div class="content">
    <div class="ig latin">OPTIONS · READY · MISSIONS</div>
    <div class="arrow">▼</div>
    <div class="ig cyr">НАСТРОЙКИ</div>
    <div class="ig words">ГОТОВ · МИССИИ · ЗАДАНИЯ</div>
    <div class="ig title gold">Cyrillic Fonts</div>
  </div>
</div></body></html>
