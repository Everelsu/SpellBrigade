<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  .scene { background-position: 50% 12%; }
  .shade { background: linear-gradient(90deg, rgba(6, 9, 20, .9) 0%, rgba(6, 9, 20, .72) 45%, rgba(6, 9, 20, .5) 100%); }
  .content {
    position: absolute; inset: 0; padding: 0 80px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .left { display: grid; gap: 16px; }
  .title { font-size: 76px; }
  .left { padding-bottom: 37.0px; } /* место убранной подписи — заголовок остаётся на месте */
  .x { font-size: 150px; }
</style></head>
<body><div class="canvas">
  <div class="scene"></div>
  <div class="shade"></div>
  <div class="content">
    <div class="left">
      <div class="title">Gold &amp; XP Multiplier</div>
    </div>
    <div class="x">x2</div>
  </div>
</div></body></html>
