<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  .scene { background-position: 50% 12%; }
  .shade { background: linear-gradient(90deg, rgba(6, 9, 20, .9) 0%, rgba(6, 9, 20, .72) 45%, rgba(6, 9, 20, .55) 100%); }
  .content { position: absolute; inset: 0; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; }
  .title { font-size: 76px; padding-bottom: 37px; }

  /* кусочек вкладки «Моды»: раздел мода и две его настройки */
  .menu { width: 620px; display: grid; gap: 14px; font-family: "Source Sans 3", "Segoe UI", sans-serif; }
  .section { display: flex; align-items: center; gap: 16px; padding: 10px 18px; color: var(--ink); font-size: 30px; font-weight: 600;
             background: linear-gradient(90deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0)); }
  .section .arrow { color: var(--ink); font-size: 30px; transform: rotate(90deg); display: inline-block; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 0 18px 0 58px; color: rgba(238, 240, 247, .92); font-size: 24px; font-weight: 600; }
  .value { display: flex; align-items: center; gap: 18px; min-width: 220px; justify-content: space-between; color: #fff; font-weight: 800; font-size: 24px; }
  .value .chev { color: var(--gold); font-size: 26px; }
  .reset { width: 26px; height: 26px; margin-left: 18px; opacity: .6; }
</style></head>
<body><div class="canvas">
  <div class="scene"></div><div class="shade"></div>
  <div class="content">
    <div class="title">Mod Menu</div>
    <div class="menu">
      <div class="section"><span class="arrow">›</span>Gold &amp; XP Multiplier</div>
      <div class="row"><span>Gold per Run</span><span style="display:flex;align-items:center"><span class="value"><span class="chev">‹</span>x2<span class="chev">›</span></span>
        <svg class="reset" viewBox="0 0 24 24"><path d="M18.4 8.2 A7.6 7.6 0 1 0 19.6 13.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M19.8 3.4 L19.6 9.4 L13.8 8.6 Z" fill="#fff"/></svg></span></div>
      <div class="row"><span>Run XP</span><span style="display:flex;align-items:center"><span class="value"><span class="chev">‹</span>x1.5<span class="chev">›</span></span><span class="reset"></span></span></div>
      <div class="section"><span class="arrow" style="transform:none">›</span>Pinned Challenges</div>
    </div>
  </div>
</div></body></html>
