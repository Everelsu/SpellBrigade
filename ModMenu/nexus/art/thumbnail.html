<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  .scene { background-position: 50% 0%; }
  .shade { background: rgba(6, 9, 20, .62); }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; padding-bottom: 57px; }
  .icon { width: 230px; margin-bottom: 8px; filter: drop-shadow(0 6px 24px rgba(0, 0, 0, .45)); }
  .title { font-size: 84px; }
</style></head>
<body><div class="canvas">
  <div class="scene"></div><div class="shade"></div>
  <div class="content">
    <!-- три ползунка настроек -->
    <svg class="icon" viewBox="0 0 120 96">
      <g stroke="#f2c14e" stroke-width="8" stroke-linecap="round">
        <line x1="8" y1="16" x2="112" y2="16"/><line x1="8" y1="48" x2="112" y2="48"/><line x1="8" y1="80" x2="112" y2="80"/>
      </g>
      <g fill="#f2c14e" stroke="#070b1c" stroke-width="6">
        <circle cx="38" cy="16" r="12"/><circle cx="82" cy="48" r="12"/><circle cx="54" cy="80" r="12"/>
      </g>
    </svg>
    <div class="title">Mod Menu</div>
  </div>
</div></body></html>
