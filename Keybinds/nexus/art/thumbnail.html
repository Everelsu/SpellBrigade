<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>

  .arrow { font-size: 86px; }
  .title { font-size: 72px; }

</style></head>
<body><div class="canvas">
  <div class="scene"></div><div class="shade"></div>
  <div class="content">
    <div class="keys"><div class="key old">Q</div><div class="arrow">→</div><div class="key">E</div></div>
    <div class="title">Keybinds Unlocked</div>
  </div>
</div></body></html>
